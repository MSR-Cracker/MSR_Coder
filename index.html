<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="description" content="Developer" />

    <link href="https://api.fontshare.com/v2/css?f[]=satoshi@1&f[]=array@400&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background-color: #000;
        font-family: 'Satoshi', sans-serif;
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
      }
      
      /* Disable Selection Globally */
      * {
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        cursor: url('https://r2.guns.lol/da5b89a6-9417-41bd-a485-197c598728d4.png') 16 16, auto !important;
      }

      /* Disable Image Dragging */
      img {
        pointer-events: none;
        -webkit-user-drag: none;
        user-drag: none;
      }

      /* Snowflake Animation */
      @keyframes snowfall {
        0% {
          transform: translateY(-10vh) translateX(0);
          opacity: 1;
        }
        100% {
          transform: translateY(100vh) translateX(20px);
          opacity: 0.3;
        }
      }

      .snowflake {
        position: fixed;
        top: -10vh;
        color: #fff;
        font-size: 1.5em;
        pointer-events: none;
        animation: snowfall linear infinite;
        z-index: 50;
      }

      /* Range Slider Styling */
      input[type=range] {
        -webkit-appearance: none;
        width: 100%;
        background: transparent;
        pointer-events: auto !important; /* Allow interaction with sliders */
        cursor: pointer !important;
      }
      
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 12px;
        width: 12px;
        border-radius: 50%;
        background: #ffffff;
        cursor: pointer;
        margin-top: -4px; 
        box-shadow: 0 0 10px rgba(255,255,255,0.5);
      }

      input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        cursor: pointer;
        background: rgba(255,255,255,0.3);
        border-radius: 2px;
      }
      
      input[type=range]:focus {
        outline: none;
      }
      
      /* Allow clicking on links and buttons */
      a, button {
        pointer-events: auto !important;
        cursor: pointer !important;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
<script>
  // Anti-Copy/Paste/View-Source/DevTools
  document.addEventListener('contextmenu', event => event.preventDefault());
  
  document.addEventListener('keydown', event => {
    // Block F12
    if (event.key === 'F12') {
      event.preventDefault();
      return false;
    }

    // Block Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+Shift+C (Inspect Element)
    if (event.ctrlKey && event.shiftKey && (event.key === 'I' || event.key === 'i' || event.key === 'J' || event.key === 'j' || event.key === 'C' || event.key === 'c')) {
      event.preventDefault();
      return false;
    }

    // Block Ctrl+U (View Source)
    if (event.ctrlKey && (event.key === 'U' || event.key === 'u')) {
      event.preventDefault();
      return false;
    }
    
    // Block Ctrl+S (Save Page)
    if (event.ctrlKey && (event.key === 'S' || event.key === 's')) {
      event.preventDefault();
      return false;
    }
  });

  // Block Dragging
  document.addEventListener('dragstart', event => event.preventDefault());
</script>
<link rel="stylesheet" href="/index.css">
</head>

</body>
